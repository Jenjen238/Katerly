name: CI/CD Spring Boot

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build dengan Maven (working directory = backend/)
      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # 4. Build Docker image (context = backend/ where Dockerfile lives)
      - name: Build Docker Image
        run: docker build -t spring-app ./backend -f ./backend/dockerfile