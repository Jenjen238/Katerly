name: CI/CD Spring Boot

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Generate application.properties
      - name: Create application.properties
        run: |
          cat > backend/src/main/resources/application.properties <<EOF
          spring.application.name=katerly-catering
          server.port=8080

          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}

          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=true

          spring.datasource.hikari.minimum-idle=5
          spring.datasource.hikari.maximum-pool-size=20
          spring.datasource.hikari.idle-timeout=300000
          spring.datasource.hikari.connection-timeout=20000
          spring.datasource.hikari.max-lifetime=1200000

          jwt.secret=${{ secrets.JWT_SECRET }}
          jwt.access-token.expiration=900000
          jwt.refresh-token.expiration=604800000

          cookie.secure=true
          cookie.same-site=Strict

          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=${{ secrets.MAIL_USERNAME }}
          spring.mail.password=${{ secrets.MAIL_PASSWORD }}
          spring.mail.properties.mail.smtp.auth=true
          spring.mail.properties.mail.smtp.starttls.enable=true
          spring.mail.properties.mail.smtp.starttls.required=true

          app.frontend-url=${{ secrets.FRONTEND_URL }}
          app.reset-password.expiration=3600000

          spring.security.oauth2.client.registration.google.client-id=${{ secrets.GOOGLE_CLIENT_ID }}
          spring.security.oauth2.client.registration.google.client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.google.scope=email,profile
          spring.security.oauth2.client.registration.google.redirect-uri=${{ secrets.GOOGLE_REDIRECT_URI }}

          midtrans.server-key=${{ secrets.MIDTRANS_SERVER_KEY }}
          midtrans.client-key=${{ secrets.MIDTRANS_CLIENT_KEY }}
          midtrans.is-production=false

          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.api-docs.path=/api-docs
          springdoc.swagger-ui.operationsSorter=method

          spring.servlet.multipart.max-file-size=5MB
          spring.servlet.multipart.max-request-size=10MB
          katerly.upload.dir=uploads/logos

          logging.level.com.katerly=INFO
          logging.level.org.springframework.security=WARN
          EOF

      # 4. Build aplikasi Spring Boot
      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # 5. Login Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/katerly-backend:latest \
          ./backend

      # 7. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/katerly-backend:latest

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/katerly
            docker compose pull
            docker compose up -d