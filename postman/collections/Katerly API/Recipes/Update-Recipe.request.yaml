$kind: http-request
name: Update Recipe
method: PUT
url: '{{base_url}}/api/recipes/:id'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "namaResep": "Nasi Goreng",
      "jumlahPorsi": 10,
      "margin": 30,
      "hppManual": null,
      "ingredients": [
        {
          "ingredientId": 1,
          "quantity": 2.5
        }
      ]
    }
