$kind: http-request
name: Update Ingredient
method: PUT
url: '{{base_url}}/api/ingredients/:id'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nama": "Ayam",
      "satuan": "kg",
      "hargaPerSatuan": 35000
    }
