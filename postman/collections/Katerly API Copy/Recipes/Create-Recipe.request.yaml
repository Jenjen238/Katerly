$kind: http-request
name: Create Recipe
method: POST
url: '{{base_url}}/api/recipes'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "namaResep": "Nasi Goreng",
      "jumlahPorsi": 10,
      "margin": 30,
      "hppManual": null,
      "ingredients": [
        {
          "ingredientId": 1,
          "quantity": 2.5
        }
      ]
    }
