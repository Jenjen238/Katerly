$kind: http-request
name: Add Item to Shopping List
method: POST
url: '{{base_url}}/api/shopping-lists/:id/items'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: id
    value: '1'
queryParams:
  - key: ingredientId
    value: ''
  - key: quantity
    value: ''
