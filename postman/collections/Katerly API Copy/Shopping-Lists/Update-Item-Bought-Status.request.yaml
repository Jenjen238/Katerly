$kind: http-request
name: Update Item Bought Status
method: PATCH
url: '{{base_url}}/api/shopping-lists/:id/items/:itemId/bought'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: id
    value: '1'
  - key: itemId
    value: '1'
queryParams:
  - key: isBought
    value: ''
