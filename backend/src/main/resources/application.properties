# ==============================
# APPLICATION CONFIG
# ==============================
spring.application.name=backend
server.port=8080

# ==============================
# DATABASE - H2 (Development)
# ==============================
spring.datasource.url=jdbc:h2:mem:lombadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (bisa diakses di http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# DATABASE - MySQL (Production)
# Uncomment saat siap pakai MySQL
# ==============================
# spring.datasource.url=jdbc:mysql://localhost:3306/lombadb?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ==============================
# JWT CONFIG
# ==============================
jwt.secret=lombawebdevsecretkey2024supersecretjwtkeyatleast256bits
jwt.expiration=86400000

# ==============================
# SWAGGER / OPENAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==============================
# LOGGING
# ==============================
logging.level.com.lomba=DEBUG
